# Local stack: Postgres + the app.
#   docker compose up -d db          # just the database, for `npm run dev`
#   docker compose up --build        # database + production build of the app
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: 40khelper
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d 40khelper"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/40khelper
      DIRECT_URL: postgresql://postgres:postgres@db:5432/40khelper
    ports:
      - "3000:3000"
    command: sh -c "node node_modules/prisma/build/index.js migrate deploy && node server.js"

volumes:
  pgdata:
